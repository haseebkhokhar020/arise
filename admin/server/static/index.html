<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arise — Admin Control Center</title>
<style>
:root{--bg:#070a14;--panel:#0d1220;--panel2:#141b30;--line:#1f2a46;--text:#eef1ff;--dim:#8f98bd;--acc:#38e1c6;--core:#7c5cff;--gold:#ffc857;--err:#ff5470;--ok:#4cd49c;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:0 0 60px}
a{color:var(--acc)}
h1{font-size:18px;letter-spacing:.1em}
h2{font-size:14px;margin:22px 0 10px;color:var(--acc);letter-spacing:.08em;text-transform:uppercase}
.top{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0d1220,#0a0e1a);position:sticky;top:0;z-index:5}
.top .orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 32% 30%, #a98dff, var(--core) 55%, #4b2bd6);box-shadow:0 0 22px rgba(124,92,255,.55)}
.top .who{margin-left:auto;color:var(--dim);font-size:13px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}
.tab{padding:8px 14px;border:1px solid var(--line);border-radius:999px;cursor:pointer;color:var(--dim);font-size:13px;background:var(--panel)}
.tab.on{background:var(--core);color:#fff;border-color:var(--core)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.card .n{font-size:20px;font-weight:700;color:var(--acc)}
.card .l{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:6px 8px;border-bottom:1px solid #1a2440;vertical-align:top}
.badge{padding:2px 9px;border-radius:999px;font-size:11px;background:var(--panel2);border:1px solid var(--line)}
.badge.ok{color:var(--ok);border-color:rgba(76,212,156,.4)}
.badge.err{color:var(--err)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px}
button{background:var(--core);border:none;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:13px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
button.danger{background:var(--err)}
button.mini{padding:3px 10px;font-size:11px;border-radius:6px}
.muted{color:var(--dim);font-size:12px}
.hide{display:none}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#101a30;border:1px solid var(--acc);color:var(--text);padding:10px 18px;border-radius:10px;display:none;z-index:9}
.center{max-width:420px;margin:8vh auto}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
h1 .sub{display:block;color:var(--dim);font-size:11px;letter-spacing:0;margin-top:4px;font-weight:400}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg div{padding:7px 12px;cursor:pointer;color:var(--dim);font-size:12px}
.seg div.on{background:var(--acc);color:#061018}
</style>
</head>
<body>
<div id="view-login" class="hide">
  <div class="center panel">
    <div class="row" style="gap:12px"><div class="orb"></div><div><h1>ARISE <span class="sub">Admin Control Center</span></h1></div></div>
    <label>Email</label><input id="lg-email" autocomplete="username">
    <label>Password</label><input id="lg-pass" type="password" autocomplete="current-password">
    <label class="hide" id="lg-totp-row">Authenticator code</label><input class="hide" id="lg-totp" type="text">
    <div style="margin-top:16px"><button onclick="login()">Sign in</button></div>
    <p class="muted" style="margin-top:12px">MFA via authenticator app (TOTP). Sessions are short-lived and audited.</p>
  </div>
</div>

<div id="view-app" class="hide">
  <div class="top">
    <div class="orb"></div><h1>ARISE <span class="sub">Admin Control Center</span></h1>
    <div class="who"><span id="me-email"></span> · <span id="me-role"></span> · <a href="#" onclick="logout()">sign out</a></div>
  </div>
  <div class="wrap">
    <div class="tabs" id="tabs">
      <div class="tab on" data-tab="overview">Overview</div>
      <div class="tab" data-tab="releases">Releases</div>
      <div class="tab" data-tab="flags">Feature flags</div>
      <div class="tab" data-tab="announce">Announcements</div>
      <div class="tab" data-tab="ai">AI providers</div>
      <div class="tab" data-tab="subs">Subscriptions</div>
      <div class="tab" data-tab="admins">Admins</div>
      <div class="tab" data-tab="audit">Audit log</div>
    </div>

    <div id="tab-overview"></div>
    <div id="tab-releases" class="hide"></div>
    <div id="tab-flags" class="hide"></div>
    <div id="tab-announce" class="hide"></div>
    <div id="tab-ai" class="hide"></div>
    <div id="tab-subs" class="hide"></div>
    <div id="tab-admins" class="hide"></div>
    <div id="tab-audit" class="hide"></div>
  </div>
</div>
<div id="toast"></div>
<script>
const API='';
let token=localStorage.getItem('arise_token')||'';
let me=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){
  const h=Object.assign({'Content-Type':'application/json'},opts.headers||{});
  if(token) h['Authorization']='Bearer '+token;
  const r=await fetch(API+path,Object.assign({},opts,{headers:h}));
  if(r.status===401){showLogin();throw new Error('unauthorized');}
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.detail||('HTTP '+r.status));
  return j;
}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',3200);}
function showLogin(){$('view-login').classList.remove('hide');$('view-app').classList.add('hide');}
async function login(){
  const email=$('lg-email').value.trim(),pw=$('lg-pass').value;
  const r=await fetch(API+'/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
  const j=await r.json();
  if(!r.ok){toast(j.detail||'login failed');return;}
  if(j.challenge==='totp'){$('lg-totp-row').classList.remove('hide');$('lg-totp').classList.remove('hide');
    window._lgEmail=email;toast('Enter your authenticator code');return;}
  token=j.token;localStorage.setItem('arise_token',token);enter();
}
async function loginTotp(){
  if(!$('lg-totp').classList.contains('hide'))return;
}
$('lg-totp') && $('lg-totp').addEventListener('keydown',async e=>{ if(e.key==='Enter' && window._lgEmail){ 
  const r=await fetch(API+'/v1/auth/totp',{method:'POST',headers:{'Content-Type':'application/json','X-Login-Email':window._lgEmail},body:JSON.stringify({code:$('lg-totp').value})});
  const j=await r.json(); if(!r.ok){toast(j.detail);return;} token=j.token;localStorage.setItem('arise_token',token);enter();}});
async function enter(){
  $('view-app').classList.remove('hide');$('view-login').classList.add('hide');
  me=await api('/v1/admins/me');$('me-email').textContent=me.email;$('me-role').textContent=me.role;
  await loadTab('overview');
}
function logout(){token='';localStorage.removeItem('arise_token');showLogin();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=async()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');await loadTab(t.dataset.tab);});
async function loadTab(name){
  ['overview','releases','flags','announce','ai','subs','admins','audit'].forEach(x=>$('tab-'+x).classList.add('hide'));
  $('tab-'+name).classList.remove('hide');
  const el=$('tab-'+name);
  if(name==='overview')return renderOverview(el);
  if(name==='releases')return renderReleases(el);
  if(name==='flags')return renderFlags(el);
  if(name==='announce')return renderAnnounce(el);
  if(name==='ai')return renderAi(el);
  if(name==='subs')return renderSubs(el);
  if(name==='admins')return renderAdmins(el);
  if(name==='audit')return renderAudit(el);
}
async function renderOverview(el){
  const s=await api('/v1/analytics/summary?days=30');
  const fl=(await api('/v1/flags')).flags;
  const rel=(await api('/v1/releases')).releases;
  el.innerHTML=`<h2>Service</h2>
   <div class="grid">
     <div class="card"><div class="n">${rel[0]?esc(rel[0].version):'—'}</div><div class="l">latest release</div></div>
     <div class="card"><div class="n">${(s.active_subs??0)}</div><div class="l">active subscriptions</div></div>
     <div class="card"><div class="n">${s.crashes.instances??0}</div><div class="l">crash instances</div></div>
     <div class="card"><div class="n">${fl.filter(f=>f.enabled).length}/${fl.length}</div><div class="l">flags enabled</div></div>
   </div>
   <h2>Aggregate metrics (30d)</h2>
   <table><tr><th>Metric</th><th>Value</th></tr>${Object.entries(s.metrics||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(Math.round(v*100)/100)}</td></tr>`).join('')||'<tr><td colspan=2 class=muted>No telemetry yet — the Android app opts in and reports anonymized aggregates.</td></tr>'}</table>`;
}
async function renderReleases(el){
  const rel=(await api('/v1/releases')).releases;
  el.innerHTML=`<h2>App releases & staged rollouts</h2>
  <div class="panel"><b>Publish new</b>
    <div class="row"><input id="r-ver" placeholder="0.2.0" style="width:110px"><input id="r-min" placeholder="min 0.1.0" style="width:130px"><select id="r-stage"><option>internal</option><option>alpha</option><option>beta</option><option>rollout</option><option>stable</option></select><input id="r-pct" type="number" min="0" max="100" value="10" style="width:80px"><span class="muted">%</span><input id="r-url" placeholder="APK url (signed)" style="flex:1;min-width:200px"><input id="r-sha" placeholder="sha256" style="flex:1"><input id="r-notes" placeholder="Release notes" style="flex:1.4"></div>
    <div class="row" style="margin-top:8px"><button onclick="pubRelease()">Publish</button><button class="ghost" onclick="loadTab('releases')">Refresh</button></div></div>
  <table><tr><th>Version</th><th>Min</th><th>Stage</th><th>Rollout</th><th>Notes</th><th>APK sha</th></tr>
  ${rel.map(r=>`<tr><td>${esc(r.version)}</td><td>${esc(r.min_version)}</td><td><span class="badge">${esc(r.stage)}</span></td><td>${r.rollout_percent}%</td><td>${esc(r.notes)}</td><td style="font-family:monospace;font-size:11px">${esc((r.apk_sha256||'').slice(0,12))}…</td></tr>`).join('')||'<tr><td colspan=6 class=muted>No releases yet</td></tr>'}</table>`;
}
async function pubRelease(){
  try{await api('/v1/releases',{method:'POST',body:JSON.stringify({version:$('r-ver').value,min_version:$('r-min').value,stage:$('r-stage').value,rollout_percent:+$('r-pct').value,apk_url:$('r-url').value,apk_sha256:$('r-sha').value,notes:$('r-notes').value})});toast('Released '+$('r-ver').value);loadTab('releases');}catch(e){toast(e.message);}
}
async function renderFlags(el){
  const fl=(await api('/v1/flags')).flags;
  el.innerHTML=`<h2>Feature flags</h2>
  <div class="panel"><div class="row"><input id="f-name" placeholder="new_flag_name"><button onclick="addFlag()">Add flag</button></div></div>
  ${fl.map(f=>`<div class="panel row"><span style="flex:1"><b>${esc(f.name)}</b> <span class="muted">${esc(f.note)}</span></span>
    <span class="seg"><div class="${f.enabled?'on':''}" onclick="setFlag('${f.name}',1)">On</div><div class="${!f.enabled?'on':''}" onclick="setFlag('${f.name}',0)">Off</div></span>
    <label style="display:flex;gap:6px;align-items:center">rollout <input type="number" min="0" max="100" value="${f.rollout_percent}" style="width:64px" onchange="setFlagRollout('${f.name}',this.value)">%</label></div>`).join('')}`;
}
async function setFlag(n,v){try{await api('/v1/flags/'+encodeURIComponent(n),{method:'PUT',body:JSON.stringify({enabled:!!v,rollout_percent:100})});loadTab('flags');}catch(e){toast(e.message);}}
async function setFlagRollout(n,v){try{await api('/v1/flags/'+encodeURIComponent(n),{method:'PUT',body:JSON.stringify({enabled:true,rollout_percent:+v})});toast('flag updated');}catch(e){toast(e.message);}}
async function addFlag(){try{await api('/v1/flags/'+encodeURIComponent($('f-name').value.trim()),{method:'PUT',body:JSON.stringify({enabled:false,rollout_percent:0})});loadTab('flags');}catch(e){toast(e.message);}}
async function renderAnnounce(el){
  const a=(await api('/v1/announcements')).announcements;
  el.innerHTML=`<h2>Announcements</h2>
  <div class="panel"><div class="row"><input id="a-title" placeholder="Title" style="flex:1"><input id="a-body" placeholder="Body" style="flex:2"><select id="a-sev"><option>info</option><option>warning</option><option>critical</option></select><button onclick="pubAnn()">Publish</button></div></div>
  <table><tr><th>Severity</th><th>Title</th><th>Body</th><th>Active</th></tr>${a.map(x=>`<tr><td><span class="badge ${x.severity==='critical'?'err':'ok'}">${esc(x.severity)}</span></td><td>${esc(x.title)}</td><td class="muted">${esc(x.body)}</td><td>${x.active?'yes':'no'}</td></tr>`).join('')}</table>`;
}
async function pubAnn(){try{await api('/v1/announcements',{method:'POST',body:JSON.stringify({title:$('a-title').value,body:$('a-body').value,severity:$('a-sev').value,active:true})});loadTab('announce');}catch(e){toast(e.message);}}
async function renderAi(el){
  const p=(await api('/v1/ai-profiles')).profiles;
  el.innerHTML=`<h2>AI provider configuration</h2>
  <div class="panel"><div class="row"><input id="ai-name" placeholder="profile name"><select id="ai-kind"><option>openai_compatible</option><option>local</option></select><input id="ai-ep" placeholder="endpoint URL" style="flex:1.4"><input id="ai-fast" placeholder="fast model"><input id="ai-power" placeholder="power model"><input id="ai-keyref" placeholder="secret ref (env var)" style="flex:1"><button onclick="pubAi()">Save</button></div></div>
  <table><tr><th>Name</th><th>Kind</th><th>Endpoint</th><th>Fast / Power</th><th>Enabled</th></tr>${p.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.kind)}</td><td class="muted" style="font-size:11px">${esc(x.endpoint)}</td><td>${esc(x.fast_model)} / ${esc(x.power_model)}</td><td>${x.enabled?'✓':'—'}</td></tr>`).join('')}</table>
  <p class="muted">Endpoints/models pushed to devices are the defaults the app shows. API keys are never stored here in plain text — reference a server-side secret instead.</p>`;
}
async function pubAi(){try{await api('/v1/ai-profiles',{method:'POST',body:JSON.stringify({name:$('ai-name').value,kind:$('ai-kind').value,endpoint:$('ai-ep').value,fast_model:$('ai-fast').value,power_model:$('ai-power').value,key_ref:$('ai-keyref').value,enabled:true})});loadTab('ai');}catch(e){toast(e.message);}}
async function renderSubs(el){
  const s=(await api('/v1/subs')).subscriptions;
  el.innerHTML=`<h2>Subscriptions</h2>
  <div class="panel"><div class="row"><input id="s-dev" placeholder="device_id" style="flex:1"><select id="s-plan"><option>free</option><option>support</option></select><button onclick="upSub()">Record (from Play Billing webhook)</button></div></div>
  <table><tr><th>Device</th><th>Plan</th><th>Status</th><th>Period end</th><th>Updated</th></tr>${s.map(x=>`<tr><td>${esc(x.device_id)}</td><td>${esc(x.plan)}</td><td><span class="badge ${x.status==='active'?'ok':'err'}">${esc(x.status)}</span></td><td>${x.current_period_end?new Date(x.current_period_end*1000).toISOString().slice(0,10):'—'}</td><td class="muted">${new Date(x.updated_at*1000).toISOString().slice(0,10)}</td></tr>`).join('')||'<tr><td colspan=5 class=muted>None yet</td></tr>'}</table>`;
}
async function upSub(){try{await api('/v1/subs',{method:'POST',body:JSON.stringify({device_id:$('s-dev').value,plan:$('s-plan').value,status:'active'})});loadTab('subs');}catch(e){toast(e.message);}}
async function renderAdmins(el){
  const a=(await api('/v1/admins')).admins;
  el.innerHTML=`<h2>Admins & roles</h2>
  <div class="panel"><div class="row"><input id="ad-email" placeholder="email" style="flex:1"><input id="ad-name" placeholder="name" style="flex:1"><input id="ad-pass" type="password" placeholder="password (min 10)" style="flex:1"><select id="ad-role"><option>analytics_viewer</option><option>support_admin</option><option>billing_admin</option><option>release_manager</option><option>super_admin</option></select><button onclick="addAdmin()">Add admin</button></div></div>
  <table><tr><th>Email</th><th>Name</th><th>Role</th><th>MFA</th><th>Active</th><th>Last login</th></tr>${a.map(x=>`<tr><td>${esc(x.email)}</td><td>${esc(x.name)}</td><td><span class="badge">${esc(x.role)}</span></td><td>${x.mfa?'✓ enabled':'—'}</td><td>${x.active?'yes':'no'}</td><td class="muted">${x.last_login_at?new Date(x.last_login_at*1000).toISOString().slice(0,16).replace('T',' '):'never'}</td></tr>`).join('')}</table>
  <p class="muted">Roles: super_admin &gt; release_manager &gt; support_admin &gt; billing_admin &gt; analytics_viewer. Every privileged action is written to the audit log.</p>`;
}
async function addAdmin(){try{await api('/v1/admins',{method:'POST',body:JSON.stringify({email:$('ad-email').value,name:$('ad-name').value,password:$('ad-pass').value,role:$('ad-role').value})});toast('Admin added');loadTab('admins');}catch(e){toast(e.message);}}
async function renderAudit(el){
  const a=(await api('/v1/audit?limit=300')).entries;
  el.innerHTML=`<h2>Audit log</h2><table><tr><th>Time (UTC)</th><th>Admin</th><th>Action</th><th>Detail</th></tr>${a.map(x=>`<tr><td class="muted">${new Date(x.ts*1000).toISOString().slice(0,19).replace('T',' ')}</td><td>${esc(x.email||'system')}</td><td>${esc(x.action)}</td><td class="muted">${esc(x.detail||'')}</td></tr>`).join('')}</table>`;
}
(async()=>{ if(token){ try{await enter();return;}catch(e){} } showLogin(); })();
</script>
</body>
</html>
